<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="盟约图鉴">
<title>卫戍协议盟约图鉴</title>
<style>
/* Layout: fixed ban sidebar on the left, two views on the right (pact board / free graph). */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f6f7f9; --ink:#1a1e26; --muted:#677080; --line:#d8dce3; --accent:#2c66d0;
  --r-stack:#2c66d0; --r-once:#0b8780; --r-fight:#c23b33; --r-prep:#a26f00; --r-spec:#8646c2;
  --font-body:"Noto Sans SC",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-display:"Saira Condensed","Noto Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --surface:#191d25; --surface-2:#1f242e; --ink:#e6e8ed; --muted:#8e97a6; --line:#2d3441; --accent:#76a2ff;
    --r-stack:#7aa6ff; --r-once:#41c6bd; --r-fight:#ff7a70; --r-prep:#e2b13f; --r-spec:#c29bff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#191d25; --surface-2:#1f242e; --ink:#e6e8ed; --muted:#8e97a6; --line:#2d3441; --accent:#76a2ff;
  --r-stack:#7aa6ff; --r-once:#41c6bd; --r-fight:#ff7a70; --r-prep:#e2b13f; --r-spec:#c29bff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.role-stack{--rc:var(--r-stack)} .role-once{--rc:var(--r-once)} .role-fight{--rc:var(--r-fight)} .role-prep{--rc:var(--r-prep)} .role-spec{--rc:var(--r-spec)}

/* header */
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.top .sub{color:var(--muted);font-size:12px}
.top .src{color:var(--muted);font-size:11.5px;max-width:720px}
.top .src a{color:var(--accent);text-decoration:none}
.top .src a:hover{text-decoration:underline}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs a{padding:5px 14px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
.tabs a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{color:var(--rc);font-weight:700}

.layout{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:18px}
main{min-width:0;min-height:0;position:relative}
.view{position:absolute;inset:0}
.view[hidden]{display:none}

/* sidebar */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px}
.sec-h span{font:600 15px var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums}
.pillgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ptog{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 0;font-size:12.5px;cursor:pointer;white-space:nowrap}
.ptog:hover:not(:disabled){border-color:var(--muted)}
.ptog.on{background:var(--r-fight);border-color:var(--r-fight);color:#fff;text-decoration:line-through}
.ptog:disabled{opacity:.4;cursor:not-allowed}
.rule{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.rule label{display:flex;gap:6px;align-items:center;cursor:pointer}
.search{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.sres{display:flex;flex-direction:column;gap:2px}
.sres button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:4px 6px;border-radius:5px;cursor:pointer}
.sres button:hover{background:var(--surface-2)}
.sres .nm{color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.sres img{width:24px;height:24px;border-radius:5px;border:2px solid var(--rc)}
.sres .pk{color:var(--muted);font-size:11.5px}
.sres .st{font-size:11.5px;color:var(--r-fight)}
.banned{display:flex;flex-wrap:wrap;gap:5px}
.btag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:5px;padding:2px 5px 2px 2px;font-size:12px;background:var(--surface-2);cursor:pointer}
.btag img{width:22px;height:22px;border-radius:4px;border:2px solid var(--rc);filter:grayscale(1)}
.btag:hover{border-color:var(--r-fight)}
.btag i{font-style:normal;color:var(--muted)}
.hint{margin:0;font-size:11.5px;color:var(--muted)}
.avail{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:start}
.tl{font:700 13px/20px var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.arow .names{display:flex;flex-wrap:wrap;gap:4px}
.arow .names span{color:var(--rc)}
.clear{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px;cursor:pointer}
.clear:hover{border-color:var(--r-fight);color:var(--r-fight)}

/* pact board */
#view-pacts{overflow:auto;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(640px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;border-top:4px solid var(--pc)}
.card.banned-pact{opacity:.45;filter:grayscale(.8)}
.card>header{display:flex;align-items:baseline;gap:12px;padding:10px 14px 4px;flex-wrap:wrap}
.card h3{margin:0;font-size:18px;font-weight:700}
.card .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.card .tag-ban{font-size:11px;color:#fff;background:var(--r-fight);padding:0 6px;border-radius:4px}
.card details{padding:0 14px;font-size:12.5px;color:var(--muted)}
.card summary{cursor:pointer;width:max-content}
.card details p{margin:4px 0 6px;white-space:pre-line;color:var(--ink);max-width:80ch}
.body{position:relative;display:grid;grid-template-columns:minmax(140px,210px) 1fr minmax(140px,210px);gap:40px;padding:12px 14px 16px}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.wires .w{fill:none;stroke:var(--muted);stroke-width:1.1;opacity:.42;transition:opacity .12s}
.wires .w.off{stroke-dasharray:3 4;opacity:.15}
.wires .dot{fill:var(--muted);opacity:.5}
.card.focus .wires .w{opacity:.07}
.card.focus .wires .dot{opacity:.15}
.card.focus .wires .w.hl{opacity:1;stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
.side{display:flex;flex-direction:column;gap:10px;justify-content:center;position:relative;z-index:1}
.center{display:flex;flex-direction:column;gap:9px;justify-content:center;position:relative;z-index:1}
.trow{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center}
/* operator avatar: border colour = role */
.av{--sz:46px;--bw:3px;position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0;cursor:pointer;vertical-align:top}
.av img{width:var(--sz);height:var(--sz);border-radius:8px;border:var(--bw) solid var(--rc);background:var(--surface-2);display:block;transition:transform .1s}
.av:hover img{transform:translateY(-2px)}
.av .cap{display:none;font-size:11px;line-height:1.2;color:var(--ink);max-width:calc(var(--sz) + 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.names .av .cap{display:block}
.av .xp{position:absolute;top:-4px;right:-4px;display:flex;gap:2px}
.av .xp i{width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);display:block}
.av.off img{filter:grayscale(1);opacity:.35}
.av.off::after{content:"";position:absolute;left:2px;width:calc(var(--sz) - 4px);top:calc(var(--sz) / 2 - 1px);height:2.5px;background:var(--r-fight);transform:rotate(-45deg);border-radius:2px}
.av.hl img{box-shadow:0 0 0 3px var(--accent)}
.av.sm{--sz:32px;--bw:2px}
.av.xs{--sz:28px;--bw:2px}
.av.xs .cap,.av.sm .cap{font-size:10px}
.sbox.hl{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.legend i{width:13px;height:13px;border-radius:3px;border:3px solid var(--rc);display:inline-block}
.namesw{display:flex;gap:5px;align-items:center;font-size:12.5px;cursor:pointer}
.sbox{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:6px 9px 7px}
.sh{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.sh span{font:600 12px var(--font-display);color:var(--muted)}
.sops{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.se{font-size:11.5px;color:var(--muted);margin-top:1px}
.se summary{cursor:pointer;width:max-content}
.se p{margin:3px 0 2px;font-size:12px;color:var(--ink);white-space:pre-line;line-height:1.45}
.sh span{font-weight:500}
.mini{border:0;background:none;padding:0;color:var(--rc);cursor:pointer;font-size:12px}
.mini sub{font:600 10px var(--font-display);color:var(--muted);vertical-align:baseline;margin-left:1px}
.mini.off{color:var(--muted);text-decoration:line-through;opacity:.5}
.mini:hover{text-decoration:underline}
.none{font-size:11.5px;color:var(--muted)}
@media (max-width:760px){
  .cards{grid-template-columns:1fr}
  .body{grid-template-columns:1fr;gap:12px}
  .wires{display:none}
}

/* graph */
#view-graph{display:flex;flex-direction:column}
#view-graph[hidden]{display:none}
.gtools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12.5px}
.gtools label{display:flex;gap:5px;align-items:center;cursor:pointer}
.gtools button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 10px;cursor:pointer}
.gtools button:hover{border-color:var(--muted)}
.gtools .hint{margin-left:auto}
.gwrap{flex:1;position:relative;min-height:0}
#g{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none}
#g.panning{cursor:grabbing}
.ge{stroke-width:1.3;opacity:.45}
.ge.sub{stroke:var(--muted);stroke-dasharray:4 4;opacity:.2;stroke-width:1}
.gn{cursor:pointer}
.gn .bd{fill:var(--rc)}
.gn.multi .bd{stroke:var(--ink);stroke-width:2}
.gn .tb{fill:var(--surface);stroke:var(--line)}
.gn text{font:700 10px var(--font-display);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.gn text.nm{font:500 11px var(--font-body);fill:var(--ink);display:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
body.names .gn text.nm{display:block}
.gh circle{stroke:var(--surface);stroke-width:3}
.gh text{font:700 15px var(--font-body);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.gh.sub rect{fill:var(--surface-2);stroke:var(--muted);stroke-dasharray:4 3}
.gh.sub text{fill:var(--ink);font-size:13px}
.gh{cursor:move}
.off{opacity:.18}
.gone{display:none}
#g.hov .gn:not(.hl):not(.nb),#g.hov .gh:not(.hl):not(.nb){opacity:.12}
#g.hov .ge:not(.hl){opacity:.04}
#g.hov .ge.hl{opacity:1;stroke-width:2.2}
.info{position:fixed;z-index:45;left:316px;bottom:14px;max-width:380px;max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.15);font-size:12.5px}
.info[hidden]{display:none}
.info h4{margin:0 0 4px;font-size:15px;color:var(--rc)}
.info .row{color:var(--muted)}
.info p{margin:5px 0 0}
.info .acts{display:flex;gap:8px;margin-top:8px}
.info button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 10px;cursor:pointer}

/* tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#tip[hidden]{display:none}
#tip b{color:var(--rc);font-size:14px}
#tip .row{color:var(--muted)}
#tip p{margin:4px 0 0}
#tip .lab{color:var(--muted)}

.sidebtn,.closeside{display:none}
.sidebtn{align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:500}
.sidebtn b{font:700 13px var(--font-display);color:#fff;background:var(--r-fight);border-radius:9px;padding:0 6px}
.sidebtn b:empty{display:none}
.closeside{position:sticky;top:0;z-index:2;justify-content:space-between;align-items:center;background:var(--surface);padding:4px 0 8px;margin:-4px 0 -8px;border-bottom:1px solid var(--line)}
.closeside strong{font-size:15px}
.closeside button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:6px 16px;font-weight:500;cursor:pointer}
.zoomb{display:inline-flex;gap:4px}
.zoomb button{width:30px;padding:3px 0;font-weight:700}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;inset:0;z-index:40;border-right:0;transform:translateX(-102%);transition:transform .2s ease;padding-top:10px}
  aside.open{transform:none}
  .sidebtn,.closeside{display:flex}
  .top{padding:8px 12px;gap:6px 12px}
  .top h1{font-size:15px}
  .top .sub{display:none}
  .top .src{font-size:10.5px}
  .legend{margin-left:0;font-size:11.5px;gap:8px}
  .gtools{gap:8px 12px;padding:6px 10px}
  .gtools .hint{display:none}
  .info{left:8px;right:8px;bottom:8px;max-width:none}
  #view-pacts{padding:10px}
}
@media (max-width:760px){
  .center{order:-1}
  .av{--sz:42px}
  .card>header{padding:8px 10px 2px}
  .body{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>卫戍协议：规程 · 盟约图鉴</h1>
    <div class="sub" id="subline"></div>
    <div class="src">数据来源：<a href="https://squad-pool.com/arknights-pacts">SquadPool 盟约查询</a>，原始数据整理自 <a href="https://prts.wiki/">PRTS Wiki</a>（CC BY-NC-SA 3.0）和玩家整理的《干员快速查询器》 · 头像：<a href="https://github.com/yuanyan3060/ArknightsGameResource">ArknightsGameResource</a> · 游戏素材版权归鹰角网络 · 数据取于 2026-11-17</div>
  </div>
  <nav class="tabs" aria-label="视图">
    <a href="#pacts" data-view="pacts">主盟约分屏</a>
    <a href="#graph" data-view="graph">全干员关系图</a>
  </nav>
  <div class="legend" id="legend"></div>
  <label class="namesw"><input type="checkbox" id="showNames"> 显示名字</label>
  <button type="button" class="sidebtn" id="openSide">禁用设置 <b id="sideBadge"></b></button>
</header>
<div class="layout">
  <aside id="side">
    <div class="closeside"><strong>禁用设置</strong><button type="button" id="closeSide">完成</button></div>
    <div class="sec">
      <div class="sec-h">禁用主盟约 <span id="bpCount">0/5</span></div>
      <div class="pillgrid" id="banPacts"></div>
      <div class="rule" role="radiogroup" aria-label="多主盟约干员的判定">
        <label><input type="radio" name="rule" id="ruleAny" value="any" checked> 有多个主盟约的干员：任一被禁即不可用</label>
        <label><input type="radio" name="rule" id="ruleAll" value="all"> 有多个主盟约的干员：全部被禁才不可用</label>
      </div>
    </div>
    <div class="sec">
      <div class="sec-h">禁用干员 <span id="boCount">0</span></div>
      <input class="search" id="opSearch" type="search" placeholder="搜索干员，回车禁用第一个" autocomplete="off">
      <div class="sres" id="searchRes"></div>
      <div class="banned" id="bannedOps"></div>
      <p class="hint">也可以直接点卡片或关系图里的干员来禁用、解禁。</p>
    </div>
    <div class="sec">
      <div class="sec-h">可用干员 <span id="availCount"></span></div>
      <div class="avail" id="availList"></div>
    </div>
    <button class="clear" id="clearBans" type="button">清空全部禁用</button>
  </aside>
  <main>
    <section class="view" id="view-pacts">
      <div class="cards" id="cards"></div>
    </section>
    <section class="view" id="view-graph" hidden>
      <div class="gtools">
        <label><input type="checkbox" id="gCore" checked> 主盟约连线</label>
        <label><input type="checkbox" id="gSub" checked> 副盟约连线</label>
        <label><input type="checkbox" id="gHide"> 隐藏不可用干员</label>
        <button type="button" id="gFit">适应窗口</button>
        <span class="zoomb"><button type="button" id="gZoomOut" aria-label="缩小">−</button><button type="button" id="gZoomIn" aria-label="放大">+</button></span>
        <button type="button" id="gReset">重新布局</button>
        <p class="hint">拖动干员或盟约调整位置，拖主盟约会带着只属于它的干员一起走；拖空白处平移，滚轮缩放</p>
      </div>
      <div class="gwrap">
        <svg id="g" aria-label="全干员关系图"><defs><clipPath id="avclip"><rect x="-19" y="-19" width="38" height="38" rx="6"/></clipPath></defs><g id="vp"><g id="gEdges"></g><g id="gNodes"></g></g></svg>
      </div>
    </section>
  </main>
</div>
<div id="tip" hidden></div>

 "core": false, "need": 2, "effect": "【突袭】干员10秒内未进行攻击或技能就绪时，若范围内没有敌人，则保留技力立即再部署至一名地面敌人周围，期间攻击力和生命值+(25+1×层数)%\n<达到50层>所有干员攻击速度+50"}, {"name": "不屈", "core": false, "need": 2, "effect": "地面干员被击倒时，有(18+0.4×层数)%概率立刻重新部署\n<在场3名不同【不屈】干员>地面干员被击倒时使场上所有干员技力+5"}, {"name": "调和", "core": false, "need": 1, "effect": "激活时可以使场上核心盟约的激活人数+1，【调和】干员享受已激活的核心盟约的效果"}, {"name": "协防干员", "core": false, "need": 2, "effect": "所有干员受到的物理和法术伤害-20%；【协防干员】伤害提升至120%，精锐【协防干员】造成伤害提升至140%"}, {"name": "独行", "core": false, "need": 1, "effect": "<在场1名【独行】干员>【独行】干员攻击力和生命值+60%，初始技力+15（在场2名及以上【独行】干员时失效）"}, {"name": "绝技", "core": false, "need": 2, "effect": "<在场2名精锐状态的干员>精锐状态的干员攻击力+30%\n<在场5名精锐状态的干员>精锐状态的干员技力消耗-30%\n（所有干员的精锐状态均可激活盟约）"}, {"name": "聚合", "core": false, "need": 2, "effect": "【聚合】干员攻击范围内的我方单位每秒回复攻击力(16+0.12×层数)%的生命值和攻击力(8+0.06×层数)%的元素损伤\n<在场3名【聚合】干员>【聚合】干员攻击范围内的所有干员获得(15+0.08×层数)%的庇护"}, {"name": "奥术", "core": false, "need": 2, "effect": "【奥术】干员造成伤害时额外附加一次(20+0.4×层数)%攻击力的法术伤害\n<在场3名不同【奥术】干员>场上所有敌人每次受到伤害时法术抗性-1（至多(-30-0.05×层数)）；【奥术】干员攻击范围内的敌人隐匿效果失效"}]};
const ROLE = {"持续叠加":{k:"stack",s:"叠层"},"单次叠加":{k:"once",s:"单叠"},"作战能力":{k:"fight",s:"战斗"},"整备能力":{k:"prep",s:"整备"},"特异化":{k:"spec",s:"特异"}};
const PC = {"炎":"#d24b3e","萨尔贡":"#c8952a","维多利亚":"#3e63c4","谢拉格":"#3f9fd0","阿戈尔":"#22907f","叙拉古":"#7a52b8","卡西米尔":"#7f9a2e","乌萨斯":"#8f5a3a","伊比利亚":"#4d6680","莱塔尼亚":"#b1488f"};
const OPS = DATA.ops, PACTS = DATA.pacts;
const OPMAP = Object.fromEntries(OPS.map(o=>[o.name,o]));
const CORE = PACTS.filter(p=>p.core).map(p=>p.name);
const SUB = PACTS.filter(p=>!p.core).map(p=>p.name);
const CORESET = new Set(CORE);
OPS.forEach(o=>{o.core=o.pacts.filter(p=>CORESET.has(p)); o.sub=o.pacts.filter(p=>!CORESET.has(p)); o.r=ROLE[o.type];});
const $=s=>document.querySelector(s);
const TOUCH=matchMedia("(hover: none)").matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- state ---------- */
const state={bp:new Set(),bo:new Set(),rule:"any"};
try{const s=JSON.parse(localStorage.getItem("ark-ban")||"null"); if(s){state.bp=new Set(s.bp||[]);state.bo=new Set(s.bo||[]);state.rule=s.rule||"any";}}catch(e){}
function save(){try{localStorage.setItem("ark-ban",JSON.stringify({bp:[...state.bp],bo:[...state.bo],rule:state.rule}))}catch(e){}}
function avail(o){
  if(state.bo.has(o.name)) return false;
  if(!o.core.length) return true;
  const n=o.core.filter(p=>state.bp.has(p)).length;
  return state.rule==="any" ? n===0 : n<o.core.length;
}
function toggleOp(name){state.bo.has(name)?state.bo.delete(name):state.bo.add(name); update();}
function togglePact(p){if(state.bp.has(p))state.bp.delete(p); else if(state.bp.size<5)state.bp.add(p); update();}

/* ---------- header ---------- */
$("#subline").textContent=`${OPS.length} 名干员 · ${CORE.length} 个主盟约 · ${SUB.length} 个副盟约`;
$("#legend").innerHTML="边框颜色："+Object.entries(ROLE).map(([full,r])=>`<span class="role-${r.k}" title="${full}"><i></i><b>${r.s}</b></span>`).join("");
try{if(localStorage.getItem("ark-names")==="1"){$("#showNames").checked=true;document.body.classList.add("names");}}catch(e){}
$("#showNames").addEventListener("change",e=>{document.body.classList.toggle("names",e.target.checked);try{localStorage.setItem("ark-names",e.target.checked?"1":"0")}catch(_){} drawAllWires();});
const img=o=>`heads/${o.head}.webp`;
function avHTML(o,cls="",extra=""){return `<button type="button" class="av role-${o.r.k} ${cls}${avail(o)?"":" off"}" data-op="${esc(o.name)}" aria-label="${esc(o.name)}"><img src="${img(o)}" alt="" width="46" height="46" loading="lazy">${extra}<span class="cap">${esc(o.name)}</span></button>`;}

/* ---------- tooltip ---------- */
const tip=$("#tip");
function showTip(o,ev){
  tip.className="role-"+o.r.k;
  tip.innerHTML=`<b>${esc(o.name)}</b> <span class="row">${o.tier}本 · ${esc(o.pacts.join(" / "))} · ${o.type}${avail(o)?"":" · 不可用"}</span>
  <p><span class="lab">精锐化前</span> ${esc(o.n)}</p><p><span class="lab">精锐化后</span> ${esc(o.e)}</p>`;
  tip.hidden=false; moveTip(ev);
}
function showPactTip(name,ev){
  const P=PACTS.find(p=>p.name===name);
  tip.className=""; tip.innerHTML=`<b style="color:var(--ink)">${esc(name)}</b> <span class="row">${P.core?"主盟约":"副盟约"} · ${P.need} 人激活${state.bp.has(name)?" · 已禁用":""}</span><p style="white-space:pre-line">${esc(P.effect)}</p>`;
  tip.hidden=false; moveTip(ev);
}
function moveTip(ev){const w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+h>innerHeight-8)y=ev.clientY-h-14;tip.style.left=x+"px";tip.style.top=y+"px";}
function hideTip(){tip.hidden=true}

/* ---------- sidebar ---------- */
function renderSide(){
  $("#banPacts").innerHTML=CORE.map(p=>`<button type="button" class="ptog${state.bp.has(p)?" on":""}" data-p="${p}" ${!state.bp.has(p)&&state.bp.size>=5?"disabled":""} aria-pressed="${state.bp.has(p)}">${p}</button>`).join("");
  $("#bpCount").textContent=state.bp.size+"/5";
  $("#ruleAny").checked=state.rule==="any"; $("#ruleAll").checked=state.rule==="all";
  $("#boCount").textContent=state.bo.size;
  $("#bannedOps").innerHTML=[...state.bo].map(n=>{const o=OPMAP[n];return `<button type="button" class="btag role-${o.r.k}" data-op="${esc(n)}" title="解禁"><img src="${img(o)}" alt="">${esc(n)}<i>×</i></button>`}).join("");
  renderSearch();
  const av=OPS.filter(avail);
  $("#availCount").textContent=av.length+"/"+OPS.length;
  $("#sideBadge").textContent=(state.bp.size+state.bo.size)||"";
  let h="";
  for(let t=1;t<=6;t++){const l=av.filter(o=>o.tier===t); if(!l.length)continue;
    h+=`<div class="arow"><span class="tl">${t}本·${l.length}</span><div class="names">${l.map(o=>avHTML(o,"xs")).join("")}</div></div>`;}
  $("#availList").innerHTML=h||'<p class="hint">没有可用干员</p>';
}
function searchHits(){const q=$("#opSearch").value.trim().toLowerCase(); if(!q)return []; return OPS.filter(o=>o.name.toLowerCase().includes(q)||o.pacts.some(p=>p===q)).slice(0,12);}
function renderSearch(){
  $("#searchRes").innerHTML=searchHits().map(o=>`<button type="button" class="role-${o.r.k}" data-op="${esc(o.name)}"><span><span class="nm"><img src="${img(o)}" alt="">${esc(o.name)}</span> <span class="pk">${o.tier}本 · ${esc(o.pacts.join("/"))}</span></span><span class="st">${state.bo.has(o.name)?"已禁用":""}</span></button>`).join("");
}
$("#banPacts").addEventListener("click",e=>{const b=e.target.closest("[data-p]"); if(b)togglePact(b.dataset.p);});
document.querySelectorAll('input[name="rule"]').forEach(r=>r.addEventListener("change",()=>{state.rule=r.value;update();}));
$("#opSearch").addEventListener("input",renderSearch);
$("#opSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){const h=searchHits(); if(h.length){state.bo.add(h[0].name); $("#opSearch").value=""; update();}}});
$("#searchRes").addEventListener("click",e=>{const b=e.target.closest("[data-op]"); if(b)toggleOp(b.dataset.op);});
$("#availList").addEventListener("click",e=>{const b=e.target.closest("[data-op]"); if(b){hideTip(); if(TOUCH)showInfo(OPMAP[b.dataset.op]); else toggleOp(b.dataset.op);}});
const asideEl=document.querySelector("aside");
asideEl.addEventListener("pointerover",e=>{if(e.pointerType==="touch")return;const b=e.target.closest("#availList [data-op]"); if(b)showTip(OPMAP[b.dataset.op],e); else hideTip();});
asideEl.addEventListener("pointermove",e=>{if(!tip.hidden)moveTip(e);});
asideEl.addEventListener("pointerleave",hideTip);
$("#bannedOps").addEventListener("click",e=>{const b=e.target.closest("[data-op]"); if(b)toggleOp(b.dataset.op);});
$("#clearBans").addEventListener("click",()=>{state.bp.clear();state.bo.clear();update();});
$("#openSide").addEventListener("click",()=>$("#side").classList.add("open"));
$("#closeSide").addEventListener("click",()=>{$("#side").classList.remove("open");hideInfo();});

/* ---------- view 1: pact board ---------- */
function chipHTML(o,pact){
  const others=o.core.filter(p=>p!==pact);
  return avHTML(o,"",others.length?`<span class="xp">${others.map(p=>`<i style="background:${PC[p]}" title="也属于${p}"></i>`).join("")}</span>`:"");
}
function cardHTML(pn){
  const P=PACTS.find(p=>p.name===pn);
  const mem=OPS.filter(o=>o.core.includes(pn));
  const nAv=mem.filter(avail).length;
  // center rows by tier
  let rows="";
  for(let t=1;t<=6;t++){const l=mem.filter(o=>o.tier===t); if(l.length) rows+=`<div class="trow"><span class="tl">${t}本</span><div class="chips">${l.map(o=>chipHTML(o,pn)).join("")}</div></div>`;}
  // secondary pacts linked from this pact's members
  const subs={};
  mem.forEach(o=>o.sub.forEach(s=>{(subs[s]=subs[s]||{links:[],tiers:[]}); subs[s].links.push(o.name); subs[s].tiers.push(o.tier);}));
  const boxes=Object.entries(subs).map(([s,v])=>{
    const pure=OPS.filter(o=>!o.core.length&&o.sub.includes(s)).sort((a,b)=>a.tier-b.tier);
    return {s,v,pure,h:2+Math.ceil(pure.length/4),mt:v.tiers.reduce((a,b)=>a+b,0)/v.tiers.length};
  }).sort((a,b)=>SUB.indexOf(a.s)-SUB.indexOf(b.s));
  // same global order in every card: left column top→bottom, then right column
  const half=Math.ceil(boxes.length/2), L=boxes.slice(0,half), R=boxes.slice(half);
  const boxHTML=b=>{const SP=PACTS.find(p=>p.name===b.s); return `<div class="sbox" data-sp="${b.s}"><div class="sh">${b.s}<span>${SP.need} 人激活</span></div>
    <details class="se"><summary>激活效果</summary><p>${esc(SP.effect)}</p></details>
    <div class="sops">${b.pure.length?b.pure.map(o=>avHTML(o,"sm")).join(""):'<span class="none">没有只带副盟约的干员</span>'}</div></div>`;};
  const banned=state.bp.has(pn);
  return `<article class="card${banned?" banned-pact":""}" data-pact="${pn}" style="--pc:${PC[pn]}">
    <header><h3>${pn}</h3>${banned?'<span class="tag-ban">已禁用</span>':""}<span class="meta">${P.need} 人激活 · ${mem.length} 名干员 · 可用 ${nAv}</span></header>
    <details><summary>激活效果</summary><p>${esc(P.effect)}</p></details>
    <div class="body"><svg class="wires" aria-hidden="true"></svg>
      <div class="side L">${L.map(boxHTML).join("")}</div>
      <div class="center">${rows}</div>
      <div class="side R">${R.map(boxHTML).join("")}</div>
    </div></article>`;
}
const openEff=new Set();
function renderCards(){
  const key=d=>d.closest(".card").dataset.pact+"|"+(d.closest(".sbox")?d.closest(".sbox").dataset.sp:"");
  document.querySelectorAll(".card details[open]").forEach(d=>openEff.add(key(d)));
  document.querySelectorAll(".card details:not([open])").forEach(d=>openEff.delete(key(d)));
  const order=[...CORE].sort((a,b)=>(state.bp.has(a)-state.bp.has(b)));
  $("#cards").innerHTML=order.map(cardHTML).join("");
  openEff.forEach(k=>{const [p,sp]=k.split("|"); const d=sp?document.querySelector(`.card[data-pact="${p}"] .sbox[data-sp="${sp}"] details`):document.querySelector(`.card[data-pact="${p}"] > details`); if(d)d.open=true;});
  drawAllWires();
}
function drawWires(card){
  const body=card.querySelector(".body"), svg=body.querySelector(".wires");
  if(getComputedStyle(svg).display==="none")return;
  const br=body.getBoundingClientRect(); let h="";
  card.querySelectorAll(".center .av").forEach(ch=>{
    const o=OPMAP[ch.dataset.op], r=ch.querySelector("img").getBoundingClientRect(), ok=avail(o);
    o.sub.forEach(s=>{
      const box=card.querySelector(`.sbox[data-sp="${s}"]`); if(!box)return;
      const bb=box.getBoundingClientRect(), hh=box.querySelector(".sh").getBoundingClientRect();
      const left=box.parentElement.classList.contains("L");
      const x1=(left?r.left:r.right)-br.left, y1=r.top+r.height/2-br.top;
      const x2=(left?bb.right:bb.left)-br.left, y2=hh.top+hh.height/2-br.top;
      const mx=(x1+x2)/2;
      h+=`<path class="w${ok?"":" off"}" data-op="${esc(o.name)}" data-sp="${s}" d="M${x1.toFixed(1)} ${y1.toFixed(1)}C${mx.toFixed(1)} ${y1.toFixed(1)} ${mx.toFixed(1)} ${y2.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
      h+=`<circle class="dot" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="2.5"/>`;
    });
  });
  svg.innerHTML=h;
}
function drawAllWires(){document.querySelectorAll(".card").forEach(drawWires);}
const cardsEl=$("#cards");
function clearFocus(){document.querySelectorAll(".card.focus").forEach(c=>{c.classList.remove("focus");c.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));});}
cardsEl.addEventListener("pointerover",e=>{
  if(e.pointerType==="touch")return;
  focusAt(e,true);
});
function focusAt(e,tipOn){
  const card=e.target.closest(".card"); if(!card)return;
  const chip=e.target.closest(".center .av"), box=e.target.closest(".sbox"), mini=e.target.closest("[data-op]");
  clearFocus();
  if(chip){card.classList.add("focus");chip.classList.add("hl");
    card.querySelectorAll(`.w[data-op="${CSS.escape(chip.dataset.op)}"]`).forEach(w=>{w.classList.add("hl");card.querySelector(`.sbox[data-sp="${w.dataset.sp}"]`).classList.add("hl");});}
  else if(box){card.classList.add("focus");box.classList.add("hl");
    card.querySelectorAll(`.w[data-sp="${box.dataset.sp}"]`).forEach(w=>{w.classList.add("hl");card.querySelector(`.center .av[data-op="${CSS.escape(w.dataset.op)}"]`).classList.add("hl");});}
  if(!tipOn)return;
  if(mini) showTip(OPMAP[mini.dataset.op],e); else hideTip();
}
cardsEl.addEventListener("pointermove",e=>{if(!tip.hidden)moveTip(e);});
cardsEl.addEventListener("pointerleave",e=>{if(e.pointerType==="touch")return;clearFocus();hideTip();});
cardsEl.addEventListener("click",e=>{const b=e.target.closest("[data-op]");
  if(TOUCH){ if(b){focusAt(e,false); showInfo(OPMAP[b.dataset.op]);} else if(!e.target.closest("summary,details")){clearFocus(); hideInfo();} return; }
  if(b)toggleOp(b.dataset.op);});
new ResizeObserver(()=>{if(!$("#view-pacts").hidden)drawAllWires();}).observe($("#cards"));
document.addEventListener("toggle",e=>{if(e.target.closest&&e.target.closest(".card"))drawAllWires();},true);

/* ---------- view 2: graph ---------- */
const svg=$("#g"), vp=$("#vp"), gE=$("#gEdges"), gN=$("#gNodes");
const G={nodes:[],edges:[],by:{},k:1,tx:0,ty:0,built:false};
function textW(s){let w=0;for(const c of s)w+=/[\x00-\x7f]/.test(c)?7.6:13.4;return w;}
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}}
function layoutGraph(){
  const rnd=rng(7);
  const N=[],E=[],by={};
  CORE.forEach((p,i)=>{const a=i/CORE.length*Math.PI*2-Math.PI/2;const n={id:"p:"+p,hub:true,core:true,name:p,x:Math.cos(a)*720,y:Math.sin(a)*720,r:38,cr:58,fixed:true,vx:0,vy:0,edges:[]};N.push(n);by[n.id]=n;});
  SUB.forEach((p,i)=>{const a=i/SUB.length*Math.PI*2;const n={id:"p:"+p,hub:true,core:false,name:p,x:Math.cos(a)*260,y:Math.sin(a)*260,w:textW(p)+26,cr:44,vx:0,vy:0,edges:[]};N.push(n);by[n.id]=n;});
  OPS.forEach(o=>{
    const hubs=(o.core.length?o.core:o.sub).map(p=>by["p:"+p]);
    const x=hubs.reduce((a,h)=>a+h.x,0)/hubs.length, y=hubs.reduce((a,h)=>a+h.y,0)/hubs.length;
    const n={id:"o:"+o.name,op:o,x:x*0.85+(rnd()-.5)*160,y:y*0.85+(rnd()-.5)*160,w:44,cr:31,vx:0,vy:0,edges:[]};
    N.push(n);by[n.id]=n;
    o.pacts.forEach(p=>{const core=CORESET.has(p);const e={s:n,t:by["p:"+p],core,
      L:core?(o.core.length>1?160:120):(o.core.length?260:90),
      k:core?0.05:(o.core.length?0.003:0.05)};E.push(e);n.edges.push(e);by["p:"+p].edges.push(e);});
  });
  const IT=650;
  for(let it=0;it<IT;it++){
    const al=1-it/IT;
    for(let i=0;i<N.length;i++){const a=N[i];for(let j=i+1;j<N.length;j++){const b=N[j];
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy; if(d2<1){dx=rnd()-.5;dy=rnd()-.5;d2=dx*dx+dy*dy+.01;}
      const d=Math.sqrt(d2), min=a.cr+b.cr; let f=d<900?2600/d2:0; if(d<min)f+=(min-d)*0.35;
      const fx=dx/d*f, fy=dy/d*f; a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;}}
    for(const e of E){const dx=e.t.x-e.s.x,dy=e.t.y-e.s.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-e.L)*e.k,fx=dx/d*f,fy=dy/d*f;e.s.vx+=fx;e.s.vy+=fy;e.t.vx-=fx;e.t.vy-=fy;}
    for(const n of N){ if(n.fixed){n.vx=n.vy=0;continue;}
      n.vx-=n.x*0.0008; n.vy-=n.y*0.0008;
      const v=Math.hypot(n.vx,n.vy), cap=40; if(v>cap){n.vx*=cap/v;n.vy*=cap/v;}
      n.x+=n.vx*(0.3+al*0.7); n.y+=n.vy*(0.3+al*0.7); n.vx*=0.55; n.vy*=0.55;}
  }
  Object.assign(G,{nodes:N,edges:E,by});
}
function loadPos(){try{const p=JSON.parse(localStorage.getItem("ark-graph-pos")||"null"); if(p)G.nodes.forEach(n=>{if(p[n.id]){n.x=p[n.id][0];n.y=p[n.id][1];}});}catch(e){}}
function savePos(){try{localStorage.setItem("ark-graph-pos",JSON.stringify(Object.fromEntries(G.nodes.map(n=>[n.id,[Math.round(n.x),Math.round(n.y)]]))))}catch(e){}}
function renderGraph(){
  gE.innerHTML=G.edges.map((e,i)=>`<line class="ge${e.core?"":" sub"}" data-i="${i}" ${e.core?`stroke="${PC[e.t.name]}"`:""}/>`).join("");
  gN.innerHTML=G.nodes.map(n=>{
    if(n.hub&&n.core) return `<g class="gh" data-id="${n.id}"><circle r="${n.r}" fill="${PC[n.name]}"/><text>${n.name}</text></g>`;
    if(n.hub) return `<g class="gh sub" data-id="${n.id}"><rect x="${-n.w/2}" y="-15" width="${n.w}" height="30" rx="15"/><text>${n.name}</text></g>`;
    const o=n.op;
    return `<g class="gn role-${o.r.k}${o.core.length>1?" multi":""}" data-id="${esc(n.id)}"><rect class="bd" x="-22" y="-22" width="44" height="44" rx="8"/><image href="${img(o)}" x="-19" y="-19" width="38" height="38" clip-path="url(#avclip)" preserveAspectRatio="xMidYMid slice"/><circle class="tb" cx="-19" cy="-19" r="8"/><text x="-19" y="-19">${o.tier}</text><text class="nm" y="33">${esc(o.name)}</text></g>`;
  }).join("");
  G.nodes.forEach(n=>{n.el=gN.querySelector(`[data-id="${CSS.escape(n.id)}"]`);});
  G.edges.forEach((e,i)=>{e.el=gE.children[i];});
  G.nodes.forEach(placeNode); G.edges.forEach(placeEdge);
  applyGraphState();
}
function placeNode(n){n.el.setAttribute("transform",`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);}
function placeEdge(e){const l=e.el;l.setAttribute("x1",e.s.x.toFixed(1));l.setAttribute("y1",e.s.y.toFixed(1));l.setAttribute("x2",e.t.x.toFixed(1));l.setAttribute("y2",e.t.y.toFixed(1));}
function applyView(){vp.setAttribute("transform",`translate(${G.tx},${G.ty}) scale(${G.k})`);}
function fit(){
  const vis=G.nodes.filter(n=>!n.el.classList.contains("gone"));
  const xs=vis.map(n=>n.x),ys=vis.map(n=>n.y);
  const x0=Math.min(...xs)-90,x1=Math.max(...xs)+90,y0=Math.min(...ys)-60,y1=Math.max(...ys)+60;
  const W=svg.clientWidth,H=svg.clientHeight; G.k=Math.min(W/(x1-x0),H/(y1-y0));
  G.tx=W/2-(x0+x1)/2*G.k; G.ty=H/2-(y0+y1)/2*G.k; applyView();
}
function applyGraphState(){
  if(!G.built)return;
  const showCore=$("#gCore").checked, showSub=$("#gSub").checked, hide=$("#gHide").checked;
  G.nodes.forEach(n=>{
    if(n.hub){n.el.classList.toggle("off",n.core&&state.bp.has(n.name));return;}
    const ok=avail(n.op); n.el.classList.toggle("off",!ok&&!hide); n.el.classList.toggle("gone",!ok&&hide);});
  G.edges.forEach(e=>{const ok=avail(e.s.op);
    e.el.classList.toggle("gone",(e.core?!showCore:!showSub)||(!ok&&hide));
    e.el.classList.toggle("off",!ok&&!hide);});
}
function buildGraph(){
  if(G.built)return; layoutGraph(); loadPos(); G.built=true; renderGraph(); fit();
}
/* hover highlight */
function hoverOn(n){
  svg.classList.add("hov"); n.el.classList.add("hl");
  n.edges.forEach(e=>{e.el.classList.add("hl"); const m=e.s===n?e.t:e.s; m.el.classList.add("nb");});
}
function hoverOff(){svg.classList.remove("hov"); svg.querySelectorAll(".hl,.nb").forEach(x=>x.classList.remove("hl","nb"));}
/* interaction */
let drag=null; const pts=new Map(); let pinch=null;
function zoomAt(mx,my,k){k=Math.min(3,Math.max(.12,k));G.tx=mx-(mx-G.tx)*k/G.k;G.ty=my-(my-G.ty)*k/G.k;G.k=k;applyView();}
function toGraph(ev){const r=svg.getBoundingClientRect();return {x:(ev.clientX-r.left-G.tx)/G.k,y:(ev.clientY-r.top-G.ty)/G.k};}
svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const [a,b]=[...pts.values()],r=svg.getBoundingClientRect();
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top,k:G.k,tx:G.tx,ty:G.ty}; if(drag&&drag.kind==="node"&&drag.moved>2)savePos(); drag=null; return;}
  if(pts.size>2)return;
  const el=e.target.closest("[data-id]");
  if(el){const n=G.by[el.dataset.id]; const p=toGraph(e);
    const group=[n]; if(n.hub&&n.core) G.nodes.forEach(m=>{if(m.op&&m.op.core.length===1&&m.op.core[0]===n.name)group.push(m);});
    drag={kind:"node",n,group,last:p,moved:0};}
  else {drag={kind:"pan",sx:e.clientX,sy:e.clientY,tx:G.tx,ty:G.ty,moved:0}; svg.classList.add("panning");}
});
svg.addEventListener("pointermove",e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch){ if(pts.size<2)return; const [a,b]=[...pts.values()],r=svg.getBoundingClientRect();
    const k=Math.min(3,Math.max(.12,pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d)), mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
    const gx=(pinch.mx-pinch.tx)/pinch.k, gy=(pinch.my-pinch.ty)/pinch.k; G.k=k; G.tx=mx-gx*k; G.ty=my-gy*k; applyView(); return;}
  if(!drag){ if(e.pointerType==="touch")return;const el=e.target.closest("[data-id]"); hoverOff(); if(el){const n=G.by[el.dataset.id]; hoverOn(n); if(n.op)showTip(n.op,e); else showPactTip(n.name,e);} else hideTip(); return;}
  hideTip();
  if(drag.kind==="pan"){G.tx=drag.tx+e.clientX-drag.sx;G.ty=drag.ty+e.clientY-drag.sy;drag.moved+=1;applyView();return;}
  const p=toGraph(e),dx=p.x-drag.last.x,dy=p.y-drag.last.y; drag.last=p; drag.moved+=Math.abs(dx)+Math.abs(dy);
  const touched=new Set();
  drag.group.forEach(n=>{n.x+=dx;n.y+=dy;placeNode(n);n.edges.forEach(ed=>touched.add(ed));});
  touched.forEach(placeEdge);
});
function endPointer(e){
  pts.delete(e.pointerId);
  if(pinch){ if(pts.size===0)pinch=null; return; }
  if(drag&&drag.kind==="node"){ if(drag.moved<3&&drag.n.op){showInfo(drag.n.op);} else savePos(); }
  if(drag&&drag.kind==="pan"&&drag.moved<2){hideInfo();}
  drag=null; svg.classList.remove("panning");
}
svg.addEventListener("pointerup",endPointer);
svg.addEventListener("pointercancel",endPointer);
svg.addEventListener("pointerleave",()=>{if(!drag){hoverOff();hideTip();}});
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,G.k*Math.exp(-e.deltaY*0.0015));},{passive:false});
$("#gZoomIn").addEventListener("click",()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,G.k*1.3));
$("#gZoomOut").addEventListener("click",()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,G.k/1.3));
function hideInfo(){G.focus=null;$("#ginfo").hidden=true;}
function showInfo(o){
  G.focus=o;
  const box=$("#ginfo"); box.className="info role-"+o.r.k; const ok=avail(o);
  box.innerHTML=`<h4>${esc(o.name)}</h4><div class="row">${o.tier}本 · ${esc(o.pacts.join(" / "))} · ${o.type}${ok?"":" · 不可用"}</div>
  <p><span class="row">精锐化前</span> ${esc(o.n)}</p><p><span class="row">精锐化后</span> ${esc(o.e)}</p>
  <div class="acts"><button type="button" id="gBan">${state.bo.has(o.name)?"解禁":"禁用"}这名干员</button><button type="button" id="gClose">关闭</button></div>`;
  box.hidden=false;
  $("#gBan").onclick=()=>toggleOp(o.name);
  $("#gClose").onclick=hideInfo;
}
["gCore","gSub","gHide"].forEach(id=>$("#"+id).addEventListener("change",applyGraphState));
$("#gFit").addEventListener("click",fit);
$("#gReset").addEventListener("click",()=>{try{localStorage.removeItem("ark-graph-pos")}catch(e){} layoutGraph(); renderGraph(); fit();});

/* ---------- routing & update ---------- */
function update(){save(); renderSide(); renderCards(); applyGraphState(); if(G.focus)showInfo(G.focus);}
function route(){
  const v=location.hash==="#graph"?"graph":"pacts";
  document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.dataset.view===v));
  $("#view-pacts").hidden=v!=="pacts"; $("#view-graph").hidden=v!=="graph";
  hideTip(); hideInfo();
  if(v==="graph") buildGraph(); else drawAllWires();
}
addEventListener("hashchange",route);
renderSide(); renderCards(); route();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{drawAllWires();});
</script>
</body>
